<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTMK Resource Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'navy': '#1E3A8A',
                        'bright-blue': '#3B82F6',
                        'emerald': '#10B981',
                        'light-gray': '#F9FAFB',
                        'dark-gray': '#111827'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-light-gray min-h-screen">

    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="flex justify-between items-center px-6 py-4">
            <div class="flex items-center space-x-2 logo">
                <img src="image/logo_jtmk_2021.png" alt="JTMK Logo" class="h-8 w-8 object-contain" />
                <span class="text-2xl font-bold text-navy">JTMK Resource Hub</span>
            </div>

            <div class="relative">
                <button onclick="toggleProfileDropdown()"
                    class="flex items-center space-x-2 hover:bg-gray-50 rounded-lg px-3 py-2 transition-colors">
                    <div class="w-8 h-8 bg-bright-blue rounded-full flex items-center justify-center">
                        <span id="profileInitials" class="text-white text-sm font-medium">AD</span>
                    </div>
                    <span id="profileName" class="text-dark-gray font-medium">Admin</span>
                    <svg id="profileArrow" class="w-4 h-4 text-gray-500 transition-transform" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>

                <div id="profileDropdown"
                    class="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-lg border border-gray-200 py-2 z-50 hidden">
                    <div class="px-4 py-3 border-b border-gray-100">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-bright-blue rounded-full flex items-center justify-center">
                                <span class="text-white text-sm font-medium" id="profileDropdownInitials">AD</span>
                            </div>
                            <div>
                                <p class="text-sm font-medium text-dark-gray" id="profileDropdownName">Admin User</p>
                                <p class="text-xs text-gray-500" id="profileDropdownEmail">admin@jtmk.com</p>
                            </div>
                        </div>
                    </div>
                    <div class="py-2">
                        <a href="#" onclick="openProfileModal()"
                            class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                            <svg class="w-4 h-4 mr-3 text-gray-400" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            My Profile
                        </a>
                        <a href="#" id="logoutButton"
                            class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                            <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                                </path>
                            </svg>
                            Sign Out
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex">

        <aside class="w-64 bg-white shadow-sm min-h-screen">
            <nav class="mt-6">
                <div class="space-y-2">
                    <div class="px-4">
                        <h3 class="mb-2 px-4 text-xs font-medium text-gray-500 uppercase">
                            Overview
                        </h3>
                        <a href="maindashboard.html"
                            class="flex items-center px-4 py-3 text-dark-gray hover:bg-gray-50 rounded-lg transition-colors">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
                            </svg>
                            Dashboard
                        </a>
                    </div>

                    <div class="px-4 pt-4">
                        <h3 class="mb-2 px-4 text-xs font-medium text-gray-500 uppercase">
                            Management
                        </h3>
                        <div class="space-y-2">
                            <a href="approvalAdmin.html"
                                class="flex items-center px-4 py-3 text-dark-gray hover:bg-gray-50 rounded-lg transition-colors">
                                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                Approvals
                                <span id="pendingCountBadge"
                                    class="ml-auto bg-red-500 text-white text-xs px-2 py-1 rounded-full"></span>
                            </a>
                            <a href="inventoryAdmin.html"
                                class="flex items-center px-4 py-3 text-dark-gray hover:bg-gray-50 rounded-lg transition-colors">
                                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                                </svg>
                                Inventory
                            </a>
                            <a href="userManagement.html"
                                class="flex items-center px-4 py-3 text-dark-gray hover:bg-gray-50 rounded-lg transition-colors">
                                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                                    </path>
                                </svg>
                                User Management
                            </a>
                        </div>
                    </div>

                    <div class="px-4 pt-4">
                        <h3 class="mb-2 px-4 text-xs font-medium text-gray-500 uppercase">
                            System
                        </h3>
                        <a href="activity_feed.html"
                            class="flex items-center px-4 py-3 text-bright-blue bg-blue-50 rounded-lg font-medium">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                                </path>
                            </svg>
                            Activity Logs
                        </a>
                    </div>
                </div>
            </nav>
        </aside>

        <main class="flex-1 p-8">
            <h2 class="text-3xl font-bold text-dark-gray mb-6">System Activity Feed</h2>

            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="overflow-x-auto border rounded-lg">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="text-left py-3 px-4 font-medium">Timestamp</th>
                                <th class="text-left py-3 px-4 font-medium">User</th>
                                <th class="text-left py-3 px-4 font-medium">Action</th>
                                <th class="text-left py-3 px-4 font-medium">Details</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody" class="divide-y divide-gray-100">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>
    <div id="logoutModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 hidden">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-6">
            <h3 class="text-lg font-semibold text-dark-gray mb-2">Confirm Sign Out</h3>
            <p class="text-gray-600 mb-6">Are you sure you want to sign out?</p>
            <div class="flex justify-end space-x-3">
                <button id="cancelLogout"
                    class="px-4 py-2 rounded bg-gray-100 text-dark-gray hover:bg-gray-200 transition">Cancel</button>
                <button id="confirmLogout"
                    class="px-4 py-2 rounded bg-red-600 text-white hover:bg-red-700 transition">Yes, Sign Out</button>
            </div>
        </div>
    </div>

    <script src="profileDropdown.js"></script>

    <script>
        function loadActivityLogs() {
            const logTableBody = document.getElementById('logTableBody');
            // FIX: Changed colspan="5" to colspan="4"
            logTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500">Loading logs...</td></tr>';

            fetch('get_activity_logs.php')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok. Are you logged in as admin?');
                    }
                    return response.json();
                })
                .then(logs => {
                    logTableBody.innerHTML = ''; // Clear loading state
                    if (logs.length === 0) {
                        // FIX: Changed colspan="5" to colspan="4"
                        logTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500">No activity logs found.</td></tr>';
                        return;
                    }

                    logs.forEach(log => {
                        const row = document.createElement('tr');
                        // FIX: Removed the last <td> for log.ip_address
                        row.innerHTML = `
                            <td class="py-3 px-4 text-sm text-gray-600">${new Date(log.timestamp).toLocaleString()}</td>
                            <td class="py-3 px-4 text-sm font-medium text-dark-gray">${log.username}</td>
                            <td class="py-3 px-4 text-sm">
                                <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-xs font-medium">${log.action}</span>
                            </td>
                            <td class="py-3 px-4 text-sm text-gray-700">${log.details}</td>
                        `;
                        logTableBody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Error fetching logs:', error);
                    // FIX: Changed colspan="5" to colspan="4"
                    logTableBody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-red-500">${error.message}</td></tr>`;
                });
        }

        // --- Functions from maindashboard.html for profile/logout ---
        function setProfileInfo() {
            const userName = localStorage.getItem('profileName'); // <-- FIX
            const userEmail = localStorage.getItem('profileEmail'); // <-- FIX
            const userRole = localStorage.getItem('userRole');

            if (userName && userEmail) {
                const initials = userName.split(' ').map(n => n[0]).join('').toUpperCase() || 'U';

                // For Top Nav Bar
                document.getElementById('profileInitials').textContent = initials;
                document.getElementById('profileName').textContent = userName;

                // For Dropdown
                document.getElementById('profileDropdownInitials').textContent = initials;
                document.getElementById('profileDropdownName').textContent = userName;
                document.getElementById('profileDropdownEmail').textContent = userEmail;
            } else {
                console.warn('User info not found in localStorage. Redirecting to login.');
                window.location.href = 'login.html';
            }

            // This script is for an admin page, so it checks for admin role
            if (!userRole || userRole.toLowerCase() !== 'admin') {
                console.warn('User is not an admin. Redirecting to login.');
                window.location.href = 'login.html';
            }
        }

        function attachLogoutEvents() {
            const logoutButton = document.getElementById('logoutButton');
            const logoutModal = document.getElementById('logoutModal');
            const cancelLogout = document.getElementById('cancelLogout');
            const confirmLogout = document.getElementById('confirmLogout');

            if (logoutButton) {
                logoutButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (logoutModal) logoutModal.classList.remove('hidden');
                });
            }
            if (cancelLogout) {
                cancelLogout.addEventListener('click', () => {
                    if (logoutModal) logoutModal.classList.add('hidden');
                });
            }
            if (confirmLogout) {
                confirmLogout.addEventListener('click', () => {
                    localStorage.clear(); // Clear all localStorage
                    window.location.href = 'login.html';
                });
            }
        }

        function openProfileModal() {
            alert('Open My Profile modal or page here.');
        }
        // --- End functions from maindashboard.html ---

        // --- Run Everything on Page Load ---
        document.addEventListener('DOMContentLoaded', () => {
            setProfileInfo();
            attachLogoutEvents();
            loadActivityLogs();
        });
    </script>
</body>

</html>
