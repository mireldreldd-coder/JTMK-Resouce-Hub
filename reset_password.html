<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password - JTMK Resource Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'navy': '#1E3A8A',
                        'bright-blue': '#3B82F6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
        <div class="text-center mb-6">
            <img src="image/logo_jtmk_2021.png" alt="JTMK Logo" class="w-20 h-20 object-contain mx-auto mb-4"/>
            <h1 class="text-2xl font-bold text-navy">Set a New Password</h1>
            <p class="text-gray-600">Please enter and confirm your new password.</p>
        </div>
        
        <form id="resetForm" onsubmit="handleResetSubmit(event)">
            <input type="hidden" id="resetTokenInput">
            
            <div class="space-y-4">
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <input type="password" id="password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-bright-blue">
                </div>
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                    <input type="password" id="confirmPassword" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-bright-blue">
                </div>
            </div>
            
            <p id="messageArea" class="text-sm text-center mt-4"></p>
            
            <div class="mt-6">
                <button type="submit" id="submitButton" class="w-full px-4 py-3 bg-bright-blue text-white rounded-lg hover:bg-blue-700 font-medium">
                    Update Password
                </button>
            </div>
        </form>
    </div>

    <script>
        // --- 1. Get the token from the URL when the page loads ---
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                // No token found
                document.getElementById('messageArea').textContent = 'Error: Invalid or missing reset link.';
                document.getElementById('messageArea').className = 'text-sm text-center mt-4 text-red-600';
                document.getElementById('submitButton').disabled = true;
            } else {
                // Store the token in the hidden input
                document.getElementById('resetTokenInput').value = token;
            }
        });

        // --- 2. Handle the form submission ---
        async function handleResetSubmit(event) {
            event.preventDefault();
            
            const token = document.getElementById('resetTokenInput').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageArea = document.getElementById('messageArea');
            const submitButton = document.getElementById('submitButton');

            // --- Basic validation ---
            if (password !== confirmPassword) {
                messageArea.textContent = 'Error: Passwords do not match.';
                messageArea.className = 'text-sm text-center mt-4 text-red-600';
                return;
            }
            if (password.length < 8) {
                messageArea.textContent = 'Error: Password must be at least 8 characters long.';
                messageArea.className = 'text-sm text-center mt-4 text-red-600';
                return;
            }
            
            submitButton.disabled = true;
            messageArea.textContent = 'Processing...';
            messageArea.className = 'text-sm text-center mt-4 text-gray-600';

            // --- 3. Send data to the new PHP file ---
            try {
                const response = await fetch('update_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        password: password
                    })
                });

                const result = await response.json();

                if (result.success) {
                    messageArea.textContent = 'Success! Your password has been updated. You can now log in.';
                    messageArea.className = 'text-sm text-center mt-4 text-green-600';
                    document.getElementById('resetForm').reset();
                } else {
                    messageArea.textContent = 'Error: ' + result.message;
                    messageArea.className = 'text-sm text-center mt-4 text-red-600';
                    submitButton.disabled = false;
                }

            } catch (error) {
                console.error('Fetch Error:', error);
                messageArea.textContent = 'A server error occurred. Please try again.';
                messageArea.className = 'text-sm text-center mt-4 text-red-600';
                submitButton.disabled = false;
            }
        }
    </script>
</body>
</html>
